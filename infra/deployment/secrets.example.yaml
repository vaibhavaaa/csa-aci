# Template for the Kubernetes Secret. Copy to secrets.yaml and fill REAL values.
# secrets.yaml is gitignored and must never be committed.
#
#   cp secrets.example.yaml secrets.yaml   # then edit the values below
#
# SECRET_KEY: generate a fresh random one — DO NOT ship a known/default value
# (a public key lets anyone forge auth tokens):
#   python -c "import secrets; print(secrets.token_urlsafe(48))"
apiVersion: v1
kind: Secret
metadata:
  name: csa-aci-secrets
  namespace: default
type: Opaque
stringData:
  # Database credentials
  POSTGRES_USER: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
  POSTGRES_DB: csa_db
  DATABASE_URL: postgresql://REPLACE_ME:REPLACE_ME@postgres-service:5432/csa_db

  # App secrets — generate a fresh random SECRET_KEY (see header)
  SECRET_KEY: REPLACE_ME_WITH_A_FRESH_RANDOM_SECRET
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"

  # Redis
  REDIS_URL: redis://redis-service:6379
