name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # conftest.py wires sys.path for the csa_aci package and uses an
      # in-memory SQLite, so no Postgres/Redis is needed. Real-trace tests
      # fall back to synthetic data (raw traces are not checked in).
      - name: Run tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # Build the backend + frontend images and publish them to GitHub Container
  # Registry. Runs only after tests pass, and only on pushes to main (PRs —
  # including from forks — skip this, since they lack package-write access).
  images:
    name: Build & push images (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Real deployment verification: spin up an ephemeral kind (Kubernetes-in-
  # Docker) cluster on the runner, deploy the FULL manifest set, and smoke-test
  # that the app rolls out, serves /healthz + /metrics, and that Prometheus is
  # actually scraping the backend. This proves the k8s manifests + CD path work
  # end-to-end with no external cluster or cloud creds.
  deploy-kind:
    name: Deploy smoke test (kind)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t csa-aci-backend:latest .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t csa-aci-frontend:latest frontend

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: csa-test

      - name: Load images into the cluster
        run: |
          kind load docker-image csa-aci-backend:latest  --name csa-test
          kind load docker-image csa-aci-frontend:latest --name csa-test

      - name: Create app secret (ephemeral test values)
        run: |
          kubectl create secret generic csa-aci-secrets \
            --from-literal=POSTGRES_USER=csa_user \
            --from-literal=POSTGRES_PASSWORD=csa_pass \
            --from-literal=POSTGRES_DB=csa_db \
            --from-literal=DATABASE_URL=postgresql://csa_user:csa_pass@postgres-service:5432/csa_db \
            --from-literal=REDIS_URL=redis://redis-service:6379 \
            --from-literal=SECRET_KEY=$(openssl rand -hex 32) \
            --from-literal=ALGORITHM=HS256 \
            --from-literal=ACCESS_TOKEN_EXPIRE_MINUTES=60

      - name: Deploy data layer (postgres + redis)
        run: |
          kubectl apply -f infra/deployment/postgres.yaml
          kubectl apply -f infra/deployment/redis.yaml
          kubectl rollout status statefulset/postgres --timeout=180s
          kubectl rollout status deployment/redis --timeout=120s

      - name: Deploy app, ingress, HPA, and monitoring
        run: |
          kubectl apply -f infra/deployment/backend.yaml
          kubectl apply -f infra/deployment/frontend.yaml
          kubectl apply -f infra/deployment/nginx.yaml
          kubectl apply -f infra/deployment/hpa.yaml
          kubectl apply -f infra/deployment/monitoring/
          kubectl rollout status deployment/backend    --timeout=240s
          kubectl rollout status deployment/frontend   --timeout=180s
          kubectl rollout status deployment/nginx      --timeout=120s
          kubectl rollout status deployment/prometheus --timeout=120s
          kubectl rollout status deployment/grafana    --timeout=120s

      - name: Smoke test — backend /healthz and /metrics
        run: |
          kubectl port-forward svc/backend-service 8000:8000 &
          PF=$!; sleep 5
          curl -fsS http://localhost:8000/healthz | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/metrics | grep -q 'http_request'
          kill $PF

      - name: Smoke test — Prometheus is scraping the backend (up)
        run: |
          kubectl port-forward svc/prometheus-service 9090:9090 &
          PF=$!; sleep 5
          ok=
          for i in $(seq 1 18); do
            if curl -fsS http://localhost:9090/api/v1/targets \
                 | jq -e '[.data.activeTargets[] | select(.labels.app=="backend" and .health=="up")] | length > 0' >/dev/null; then
              ok=1; break
            fi
            sleep 5
          done
          kill $PF
          if [ -z "$ok" ]; then echo "backend target never came up in Prometheus"; exit 1; fi

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          for app in backend frontend nginx prometheus grafana; do
            echo "===== logs: app=$app (current) ====="
            kubectl logs -l "app=$app" --tail=120 --all-containers || true
            echo "===== logs: app=$app (previous, if crashed) ====="
            kubectl logs -l "app=$app" --tail=120 --all-containers --previous || true
          done
